<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PHYSQORA — THE UNIVERSE, EXPLORED. An interactive virtual physics laboratory where students can explore scientific concepts, conduct experiments, visualize physical phenomena, and understand the laws governing our universe."
    />
    <meta name="theme-color" content="#070b16" />
    <title>PHYSQORA — THE UNIVERSE, EXPLORED.</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('physicslab:theme') || 'null');
          var pref = (stored && stored.state && stored.state.theme) || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PHYSQORA requires JavaScript to run interactive simulations.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
